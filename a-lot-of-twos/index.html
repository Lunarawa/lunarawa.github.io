<!DOCTYPE html>
<html>
    <head>
        <link rel="icon" type="image/x-icon" href="../resources/favicon.ico">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@700&display=swap">
        <meta charset="utf-8"> 
        <meta name="author" content="Lunarawa">
        <meta name="description" content="How long can you connect with ever increasing numbers? That's a bad description.">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="script.js" defer></script>
        <title>A Lot of Twos</title>
    </head>
    <body>
        <h1 class="center myself-large">
            A Lot of Twos
        </h1>
        <p class="center myself-small" id="score">0 / ??? (0 pts, Level 1)</p>
        <div class="tile-current-tile-stripe" id="tile-current-tile-stripe">
            <p class="center" id="tile-current-tile-representation"></p>
        </div>
        <canvas class="center" id="field" width="310" height="370">
            <p class="myself-small">Your device may not support canvas or JavaScript is disabled.</p>
        </canvas>
        <div class="center control">
            <button id="restart" type="button">Restart</button>
            <button id="playback" type="button" disabled>Play Playback</button>
            <button id="export" type="button">Export</button>
            <button id="import" type="button">Import</button>
            <input id="import-file" type="file" accept=".lwa,.bin" hidden>
        </div>
        <div class="center settings">
            <label for="animation-speed">Animation speed: <span id="animation-speed-value">200 ms</span></label>
            <input id="animation-speed" type="range" min="0" max="500" value="200">
            <label for="safe-mode"><input id="safe-mode" type="checkbox"> Safe Mode</label>
        </div>
        <p class="center myself-small" id="messages"></p>
    </body>
</html>
